name: Tests

on:
  push:
  pull_request:
    branches:
      - 'test/setup'
      # - '*'
      # - '*/*'
      # - '**'
      # - '!master'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.16.0
          cache: 'pnpm'
      - name: Install modules
        run: pnpm install --frozen-lockfile
    # - name: Run lint
    #   run: yarn run lint
    # - name: Run tests
    #   run: yarn run test
